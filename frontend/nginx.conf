map $http_x_forwarded_proto $upstream_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Visual Inspection accepts at most 10 MiB of image bytes across three
    # multipart parts. Reserve a bounded 1 MiB for multipart framing and file
    # metadata while rejecting larger request bodies before they reach FastAPI.
    location ~ ^/api/analyses/[0-9]+/visual-inspection$ {
        client_max_body_size 11m;
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    # Same-origin /api → FastAPI (Compose service name: backend)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $upstream_forwarded_proto;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
