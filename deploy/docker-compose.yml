# Production stack for EC2 — pulls pre-built images from ECR (do not build here).
# Copy this file to the EC2 host as docker-compose.yml (e.g. /opt/trustai/).
#
# First-time on EC2:
#   aws ecr get-login-password --region eu-north-1 \
#     | docker login --username AWS --password-stdin \
#       585142511013.dkr.ecr.eu-north-1.amazonaws.com
#   IMAGE_TAG=<commit-sha> docker compose pull
#   IMAGE_TAG=<commit-sha> docker compose up -d
#
# Required in .env beside this file: JWT_SECRET, POSTGRES_PASSWORD
# Optional: GROQ_API_KEY, AI_PROVIDER. Visual Inspection remains disabled
# unless its provider, model, and OpenAI credential are all set explicitly.
# IMAGE_TAG is supplied by the deployment command and is not stored in .env.

# Docker's default json-file log driver has no size cap -- left alone, a
# chatty container (nginx/Caddy access logs, uvicorn access logs) grows
# without bound over weeks and is the most common actual cause of a small
# EC2 instance quietly running out of disk, independent of stale images.
# 10m x 3 files = 30MB ceiling per service, rotated automatically, no cron
# or deploy-time action needed to keep this bounded.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -qO- -T 2 http://127.0.0.1:8080/api/health |
          grep -q '"status":"ok"'
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    logging: *default-logging

  backend:
    image: 585142511013.dkr.ecr.eu-north-1.amazonaws.com/trustaimarketplace/backend:${IMAGE_TAG:?set IMAGE_TAG for deployment}
    # No host port: API is reached via frontend nginx (/api → backend:8000).
    expose:
      - "8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://trustai:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/trustai
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      VISUAL_INSPECTION_PROVIDER: ${VISUAL_INSPECTION_PROVIDER:-disabled}
      VISUAL_INSPECTION_MODEL: ${VISUAL_INSPECTION_MODEL:-}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  frontend:
    image: 585142511013.dkr.ecr.eu-north-1.amazonaws.com/trustaimarketplace/frontend:${IMAGE_TAG:?set IMAGE_TAG for deployment}
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped
    logging: *default-logging

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trustai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustai -d trustai"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

volumes:
  caddy_data:
  caddy_config:
  pgdata:
