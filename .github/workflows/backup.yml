# Scheduled Postgres backup for the single-EC2 deployment (see
# docs/ci-cd/zero-trust-pipeline.md and the "Database backups" section of
# deploy/README.md). The production `pgdata` Docker volume survives normal
# redeploys (deploy.yml never runs `docker compose down -v`), but it lives
# on that one instance's disk -- if the instance is ever replaced, or the
# disk fails, there is otherwise no recovery path. This dumps the database
# and uploads it to S3 on a schedule, using the same zero-trust SSM
# send-command pattern as deploy.yml (no SSH, no inbound access).
name: Postgres backup

on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Dump Postgres on EC2 and upload to S3 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          AWS_REGION_NAME: ${{ secrets.AWS_REGION }}
        run: |
          set -euo pipefail

          REMOTE_SCRIPT="$(cat <<EOF
          set -euo pipefail
          cd ${EC2_APP_DIR}
          STAMP="\$(date -u +%Y%m%dT%H%M%SZ)"
          DUMP_FILE="/tmp/trustai-\${STAMP}.sql.gz"
          docker compose exec -T db pg_dump -U trustai -d trustai | gzip > "\${DUMP_FILE}"
          aws s3 cp "\${DUMP_FILE}" "s3://${BACKUP_S3_BUCKET}/postgres-backups/trustai-\${STAMP}.sql.gz" --region "${AWS_REGION_NAME}"
          rm -f "\${DUMP_FILE}"
          echo "Backup uploaded: trustai-\${STAMP}.sql.gz"
          EOF
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)"
          PARAMETERS="$(jq -n --arg script "$REMOTE_SCRIPT_B64" \
            '{commands: [("printf %s " + $script + " | base64 --decode | bash")]}')"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TrustAI Postgres backup" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId=${COMMAND_ID}"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          # A silent backup failure is worse than a loud one -- fail the
          # workflow (and trigger GitHub's default failure notification)
          # rather than letting a broken backup job go unnoticed.
          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "Backup failed (wait_exit=${WAIT_EXIT}, status=${STATUS})"
            exit 1
          fi
