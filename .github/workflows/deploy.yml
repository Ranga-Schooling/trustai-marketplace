# Build/push backend + frontend to ECR, then refresh containers on EC2 via SSM.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Backend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_BACKEND_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:$GITHUB_SHA" ./backend
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"

      - name: Build and Push Frontend
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ secrets.ECR_FRONTEND_REPO }}
          IMAGE_TAG: latest
        run: |
          docker build -t "$REGISTRY/$REPOSITORY:$IMAGE_TAG" -t "$REGISTRY/$REPOSITORY:$GITHUB_SHA" ./frontend
          docker push "$REGISTRY/$REPOSITORY:$IMAGE_TAG"
          docker push "$REGISTRY/$REPOSITORY:$GITHUB_SHA"

      - name: Deploy on EC2 via SSM
        env:
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
          AWS_REGION_NAME: ${{ secrets.AWS_REGION }}
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          set -euo pipefail

          COMPOSE_B64="$(base64 -w 0 deploy/docker-compose.yml)"
          CADDYFILE_B64="$(base64 -w 0 deploy/Caddyfile)"
          printf -v APP_DIR_Q '%q' "$EC2_APP_DIR"
          printf -v AWS_REGION_Q '%q' "$AWS_REGION_NAME"
          printf -v ECR_REGISTRY_Q '%q' "$ECR_REGISTRY"
          printf -v IMAGE_TAG_Q '%q' "$GITHUB_SHA"

          REMOTE_SCRIPT="$(cat <<EOF
          set -euo pipefail
          cd ${APP_DIR_Q}
          test -f .env || { echo "Missing deployment .env"; exit 1; }
          export IMAGE_TAG=${IMAGE_TAG_Q}
          printf '%s' '${COMPOSE_B64}' | base64 --decode > docker-compose.yml.next
          printf '%s' '${CADDYFILE_B64}' | base64 --decode > Caddyfile.next
          docker compose -f docker-compose.yml.next config --quiet
          echo "Disk usage before pre-pull image cleanup:"
          df -h /
          docker image prune -af
          echo "Disk usage after pre-pull image cleanup:"
          df -h /
          aws ecr get-login-password --region ${AWS_REGION_Q} | docker login --username AWS --password-stdin ${ECR_REGISTRY_Q}
          docker compose -f docker-compose.yml.next pull
          docker run --rm -v "\$PWD/Caddyfile.next:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          test ! -f docker-compose.yml || cp docker-compose.yml docker-compose.yml.previous
          test ! -f Caddyfile || cp Caddyfile Caddyfile.previous
          mv docker-compose.yml.next docker-compose.yml
          mv Caddyfile.next Caddyfile
          if ! docker compose up -d; then
            echo "Docker Compose activation failed"
            docker compose ps || true
            docker compose logs --no-color --tail=100 caddy frontend backend || true
            exit 1
          fi

          HEALTHY=0
          HEALTH_MAX_ATTEMPTS=30
          HEALTH_RETRY_SECONDS=3
          echo "Waiting approximately 90 seconds for application health"
          for attempt in \$(seq 1 "\$HEALTH_MAX_ATTEMPTS"); do
            CADDY_CONTAINER_ID="\$(docker compose ps -q caddy)"
            HEALTH_STATUS="\$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}unavailable{{end}}' "\$CADDY_CONTAINER_ID" 2>/dev/null || true)"
            if [ "\$HEALTH_STATUS" = "healthy" ]; then
              HEALTHY=1
              echo "Application health check passed on attempt \$attempt/\$HEALTH_MAX_ATTEMPTS"
              break
            fi
            echo "Waiting for application health (attempt \$attempt/\$HEALTH_MAX_ATTEMPTS, status=\$HEALTH_STATUS)"
            if [ "\$attempt" -lt "\$HEALTH_MAX_ATTEMPTS" ]; then
              sleep "\$HEALTH_RETRY_SECONDS"
            fi
          done

          if [ "\$HEALTHY" -ne 1 ]; then
            echo "Application failed to become healthy after approximately 90 seconds"
            docker compose ps || true
            docker compose logs --no-color --tail=100 caddy frontend backend || true
            exit 1
          fi

          echo "Deployment of image tag \${IMAGE_TAG} is healthy"
          docker compose ps

          echo "Disk usage before cleanup:"
          docker system df
          # -f alone (the old cleanup here) only removes *dangling* (untagged)
          # images. Every deploy pulls a uniquely SHA-tagged image, so old
          # deploys' images were never dangling and never got removed -- -a
          # removes any image not referenced by an existing container,
          # regardless of tag. Safe to run right here: the health check above
          # already confirmed the new containers are up, so the previous
          # deploy's images/containers/networks are genuinely unused, not just
          # temporarily idle.
          #
          # Deliberately no docker volume prune: an unreferenced volume isn't
          # necessarily disposable (e.g. one intentionally kept around while
          # temporarily detached from a container), and the disk incident this
          # workflow fixes showed 0B reclaimable from volumes anyway -- the
          # accumulated SHA-tagged images were the actual cause (PR #84 review).
          docker image prune -af
          docker container prune -f
          docker network prune -f
          echo "Disk usage after cleanup:"
          docker system df
          df -h /
          EOF
          )"
          REMOTE_SCRIPT_B64="$(printf '%s' "$REMOTE_SCRIPT" | base64 -w 0)"
          PARAMETERS="$(jq -n --arg script "$REMOTE_SCRIPT_B64" \
            '{commands: [("printf %s " + $script + " | base64 --decode | bash")]}')"

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "TrustAI deploy ${GITHUB_SHA}" \
            --parameters "$PARAMETERS" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM CommandId=${COMMAND_ID}"

          # send-command only queues work; wait until the instance finishes.
          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_EXIT=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,StatusDetails:StatusDetails,Stdout:StandardOutputContent,Stderr:StandardErrorContent}" \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$WAIT_EXIT" -ne 0 ] || [ "$STATUS" != "Success" ]; then
            echo "SSM deploy failed (wait_exit=${WAIT_EXIT}, status=${STATUS})"
            exit 1
          fi
