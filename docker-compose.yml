# Local development stack — builds from source.
# Production EC2 stack lives in deploy/docker-compose.yml (ECR images).
services:
  api:
    build: ./backend
    ports: ["8000:8000"]
    # `${VAR}` below only ever resolves from the shell running `docker
    # compose` (or a .env next to this file) -- it does NOT read
    # backend/.env, so AI_PROVIDER/*_API_KEY set there were silently
    # ignored and every provider setting fell back to its hardcoded
    # default (mock, empty key) no matter what backend/.env said. env_file
    # loads backend/.env's values into the container directly; `required:
    # false` keeps a from-scratch clone with no backend/.env yet working
    # (Settings' own field defaults apply, same as running uvicorn locally).
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      # Force the Compose service name as the Postgres host regardless of
      # what backend/.env has (it may point at sqlite for non-Docker use).
      DATABASE_URL: postgresql+psycopg2://trustai:trustai@db:5432/trustai
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    ports: ["5173:5173"]
    environment:
      # Reach the api container by its Compose service name, not localhost.
      API_PROXY_TARGET: http://api:8000
    depends_on: [api]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trustai
      POSTGRES_PASSWORD: trustai
      POSTGRES_DB: trustai
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trustai -d trustai"]
      interval: 2s
      timeout: 3s
      retries: 15
volumes:
  pgdata:
